name: Feature request
description: A command or option you miss
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task, not the solution. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could look
      description: An example command and its output.
      render: console
