[workspace]
resolver = "2"
members = ["crates/hydronode-api", "crates/hydronode-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["TexhFex Labs"]
repository = "https://github.com/TexhFexLabs/hydronode-cli"
homepage = "https://hydronode.tech"

[workspace.dependencies]
base64 = "0.22"
csv = "1"
directories = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac = "0.12"
jiff = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "io-util", "sync", "signal"] }
toml = "0.8"
url = "2"
# dev
insta = { version = "1", features = ["filters"] }
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
