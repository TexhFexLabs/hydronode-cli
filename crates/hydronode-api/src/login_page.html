<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<title>{{TITLE}} | HydroNode CLI</title>
<style>
:root {
  --bg: #000000; --text: #ededed; --text-2: #a1a1a1; --muted: #5e5e5e;
  --border: #1f1f1f; --border-strong: #2e2e2e; --accent: #ededed;
  --state: #3fb950; --grid: rgba(255, 255, 255, 0.035); --glow: rgba(237, 237, 237, 0.035);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #ffffff; --text: #000000; --text-2: #4d4d4d; --muted: #8f8f8f;
    --border: #ebebeb; --border-strong: #d9d9d9; --accent: #000000;
    --state: #1a7f37; --grid: rgba(0, 0, 0, 0.045); --glow: rgba(0, 0, 0, 0.025);
  }
}
body.fail { --state: #f85149; }
@media (prefers-color-scheme: light) { body.fail { --state: #cf222e; } }
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  background: var(--bg); color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
.grid {
  position: fixed; inset: 0; pointer-events: none;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 0%, #000 30%, transparent 80%);
  mask-image: radial-gradient(ellipse 80% 70% at 50% 0%, #000 30%, transparent 80%);
}
main { position: relative; flex: 1; display: flex; align-items: center; width: 100%; max-width: 1040px; margin: 0 auto; padding: 48px 24px; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 64px; width: 100%; }
h1 { margin: 0; font-size: clamp(40px, 6.6vw, 84px); line-height: 1; font-weight: 650; letter-spacing: -0.045em; }
.lead { margin: 24px 0 0; max-width: 460px; font-size: 17px; line-height: 1.6; color: var(--text-2); }
.mark { width: clamp(180px, 24vw, 260px); height: clamp(180px, 24vw, 260px); }
.mark svg { width: 100%; height: 100%; overflow: visible; }
.orbit { fill: none; stroke: var(--border-strong); stroke-width: 0.6; stroke-dasharray: 1 3.2; }
.track { fill: none; stroke: var(--state); stroke-width: 1.2; opacity: 0.55; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.1s 0.15s ease-out forwards; }
.waves circle { fill: none; stroke: var(--state); stroke-width: 0.6; opacity: 0; transform-origin: 60px 60px; animation: wave 3.2s ease-out 3; }
.waves circle + circle { animation-delay: 1.6s; }
.half path { fill: var(--accent); }
.core { fill: var(--state); transform-box: fill-box; transform-origin: center; animation: core 3.2s ease-in-out infinite; }
.glow { fill: var(--glow); }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes wave { 0% { opacity: 0.55; transform: scale(1); } 100% { opacity: 0; transform: scale(2.1); } }
@keyframes core { 0%, 100% { transform: scale(0.86); opacity: 0.8; } 50% { transform: scale(1); opacity: 1; } }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; gap: 36px; } .mark { order: -1; width: 120px; height: 120px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .track { stroke-dashoffset: 0; } }
</style>
</head>

<div class="grid" aria-hidden="true"></div>

          <circle class="core" cx="518" cy="515" r="56"/>
        </g>
      </svg>
    </div>
  </section>
</main>
</body>
</html>
