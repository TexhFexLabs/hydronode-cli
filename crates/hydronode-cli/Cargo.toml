[package]
name = "hydronode-cli"
description = "The HydroNode command line: sensors, values, devices and live data from your terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["iot", "sensors", "cli", "hydronode"]
categories = ["command-line-utilities"]
default-run = "hydronode"

[lib]
name = "hydronode_cli"
path = "src/lib.rs"

[[bin]]
name = "hydronode"
path = "src/main.rs"

[[bin]]
name = "hn"
path = "src/bin/hn.rs"

[dependencies]
hydronode-api = { path = "../hydronode-api", version = "0.1.0" }
clap = { version = "4.5", features = ["derive", "env", "string"] }
clap_complete = "4.5"
csv.workspace = true
dialoguer = { version = "0.11", default-features = false }
futures-util.workspace = true
jiff.workspace = true
open = "5"
owo-colors = "4"
parquet = { version = "60", default-features = false }
rand.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest.workspace = true
rpassword = "7"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock.workspace = true
