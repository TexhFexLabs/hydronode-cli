# cargo-deny: licenses, advisories, bans, sources. Run: cargo deny check

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is unmaintained (informational, no vulnerability). It comes only through parquet,
    # which has no feature to drop it. Revisit when parquet moves off chrono.
    { id = "RUSTSEC-2026-0543", reason = "transitive via parquet, informational only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    # tiny-keccak (via parquet → ahash → const-random), public domain dedication
    "CC0-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
