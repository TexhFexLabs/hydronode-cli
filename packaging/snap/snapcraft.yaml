# Snap of the HydroNode CLI. Packs the release binaries (static musl builds from release.yml), so the
# snap runs exactly what GitHub Releases ships. @VERSION@ is filled in by packages.yml; by hand:
#   sed -i 's/@VERSION@/0.1.0/g' snapcraft.yaml && snapcraft pack && snapcraft upload --release=stable *.snap
name: hydronode
title: HydroNode CLI
summary: Sensors, values, devices and live data of HydroNode from your terminal
description: |
  hydronode (short: hn) is the command line for HydroNode (https://hydronode.tech): status of your
  devices, value summaries, exports, live data, switching outputs and sending commands, scripted with
  --json. Sign in with the browser, a device code or an API token.
website: https://hydronode.tech/docs/guide/cli
source-code: https://github.com/TexhFexLabs/hydronode-cli
issues: https://github.com/TexhFexLabs/hydronode-cli/issues
license: MIT
version: '@VERSION@'
base: core24
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  hydronode:
    command: bin/hydronode
    plugs: [network, network-bind, home, desktop, password-manager-service]
  # `hn` as a short command needs the store's auto-alias (request on the snapcraft forum);
  # until then: `sudo snap alias hydronode.hn hn`.
  hn:
    command: bin/hn
    plugs: [network, network-bind, home, desktop, password-manager-service]

parts:
  hydronode:
    # The release archives keep the files in a folder named after the archive; take them from
    # wherever they are.
    plugin: nil
    source:
      - on amd64: https://github.com/TexhFexLabs/hydronode-cli/releases/download/v@VERSION@/hydronode-cli-x86_64-unknown-linux-musl.tar.xz
      - on arm64: https://github.com/TexhFexLabs/hydronode-cli/releases/download/v@VERSION@/hydronode-cli-aarch64-unknown-linux-musl.tar.xz
    source-type: tar
    override-build: |
      for bin in hn hydronode; do
        install -Dm755 "$(find "$CRAFT_PART_SRC" -type f -name "$bin" | head -n1)" "$CRAFT_PART_INSTALL/bin/$bin"
      done
      install -Dm644 "$(find "$CRAFT_PART_SRC" -type f -name LICENSE | head -n1)" "$CRAFT_PART_INSTALL/LICENSE"
